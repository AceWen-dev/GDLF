# Static chart views. See README.md for the schema.
# Replace `mae` with this project's primary validation metric.

defaults:
  mode: min
  max_items: 20

charts:
  - id: experiments-val
    title: "Experiments — validation {metric}"
    source: experiments
    metric: mae
    aggregate: best
    exclude_tags: [debug]

  - id: candidates-val
    title: "Candidates — validation {metric}"
    source: candidates
    metric: mae

  - id: claims-test
    title: "Reported claims — {metric}"
    source: claims
    metric: mae
    max_items: 30
