[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myproject"
version = "0.1.0"
description = "A project skeleton for DLEF"
readme = "README.md"
requires-python = ">=3.10"
# dlef is installed separately: pip install -e ../.. (or from your package index)
dependencies = [
  "torch>=2.0",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["myproject*"]
