[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlef"
version = "0.0.1"
description = "Domain-agnostic contracts for deep learning experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6", "ruff>=0.5"]
torch = ["torch>=2.0"]

[project.scripts]
dlef = "dlef.cli:main"

[tool.setuptools.packages.find]
include = ["dlef*", "adapters*"]
